# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for the open-source repository.
language: en

chat:
  auto_reply: true

reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  review_details: true
  changed_files_summary: true
  estimate_code_review_effort: true
  collapse_walkthrough: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: false
  path_filters:
    - "!docs/api/**" # Generated by gomarkdoc; review the Go source instead.
    # These legacy docs are intentionally deleted in PR #15; don't spend review
    # file slots on the removed material. Keep the remaining edited docs reviewable.
    - "!docs/agents-score.md"
    - "!docs/architecture/product-implementation-notes.md"
    - "!docs/competitive-analysis.md"
    - "!docs/design/wireframes/**"
    - "!docs/evolution-framework.md"
    - "!docs/prd-opencode-profiles.md"
    - "!docs/refactor-verification.md"
    - "!docs/verification/**"
    - "!.codegraph/**"
    - "!.git/**"
    - "!**/.cache/**"
    - "!**/dist/**"
    - "!**/build/**"
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 2
    base_branches:
      - "main"
  tools:
    markdownlint:
      enabled: true
    trufflehog:
      enabled: true
    osvScanner:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
