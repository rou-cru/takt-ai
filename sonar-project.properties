# SonarCloud CI-based analysis (.github/workflows/ci.yml) reads this file
# from the repository root. Automatic Analysis was disabled in
# SonarCloud (Administration > Analysis Method): it clones the repo on its
# own infrastructure and never runs `make test-host` /
# scripts/test-containerized.sh, so it can never see the coverage profiles
# below — CI-based analysis is required for coverage to be reported at all.
sonar.organization=roura
sonar.projectKey=rou-cru_takt-ai

# Code duplication (CPD) is gated on production code only. The test suites of
# the three target adapters are contractually symmetric by design (each asserts
# the same public behavior for its own package), so test files are excluded
# from the duplication gate (PR #4 review plan F1b).
sonar.cpd.exclusions=**/*_test.go,**/*_generated.go

# takt/tui/styles/*_generated.go (logo_generated.go, logo_blocks_generated.go)
# are `// Code generated by cmd/generate-logo; DO NOT EDIT` data files: raw
# color-span tables derived from the brand PNG. Their repeated hex-literal
# strings are an artifact of the source artwork, not a maintainability issue,
# so they're excluded from analysis entirely rather than flagged as noise.
sonar.exclusions=**/*_generated.go

# Go coverage profiles: coverage.out from `make test-host` (pure packages),
# coverage-containerized.out from scripts/test-containerized.sh (FS-touching /
# binary-executing packages, run inside Docker). SonarCloud merges comma-
# separated report paths.
sonar.go.coverage.reportPaths=coverage.out,coverage-containerized.out

# JS/TS coverage: takt/runtime/sandbox/probe.test.mjs is the only test suite
# for any JS/TS source in the repo today (it exercises adapter.mjs; run via
# Node's built-in test runner + V8 coverage, emitted as lcov by the CI step).
# The go:embed plugin assets (takt/agents/opencode/assets/*.ts, *.tsx) have no
# tests yet, so they correctly report no coverage data rather than a fake
# number — write tests for them before expecting a percentage here.
sonar.javascript.lcov.reportPaths=coverage-js.lcov
# The test file itself gets V8-instrumented like any other executed file;
# exclude it from the coverage percentage (mirrors sonar.cpd.exclusions above
# excluding *_test.go from the Go duplication gate).
sonar.coverage.exclusions=**/*.test.mjs
