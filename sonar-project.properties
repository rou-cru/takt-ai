# SonarCloud CI-based analysis (.github/workflows/ci.yml) reads this file
# from the repository root. Automatic Analysis was disabled in
# SonarCloud (Administration > Analysis Method): it clones the repo on its
# own infrastructure and never runs `make test-host` /
# development/testing/test-containerized.sh, so it can never see the coverage profiles
# below — CI-based analysis is required for coverage to be reported at all.
sonar.organization=roura
sonar.projectKey=rou-cru_takt-ai

# Code duplication (CPD) is gated on production code only. Test suites assert
# the same public behavior per package by design, so test files are excluded
# from the duplication gate.
sonar.cpd.exclusions=**/*_test.go,**/*_generated.go

# takt/tui/styles/*_generated.go (logo_generated.go, logo_blocks_generated.go)
# are `// Code generated by development/generate-logo; DO NOT EDIT` data files: raw
# color-span tables derived from the brand PNG. Their repeated hex-literal
# strings are an artifact of the source artwork, not a maintainability issue,
# so they're excluded from analysis entirely rather than flagged as noise.
sonar.exclusions=**/*_generated.go

# Go coverage profiles: coverage.out from `make test-host` (pure packages),
# coverage-containerized.out from development/testing/test-containerized.sh (FS-touching /
# binary-executing packages, run inside Docker). SonarCloud merges comma-
# separated report paths.
sonar.go.coverage.reportPaths=coverage.out,coverage-containerized.out

# Plugin Bun suites and the advisory Node sandbox suite emit separate LCOV.
# The sandbox report may be absent when its non-release-gating test fails.
sonar.javascript.lcov.reportPaths=takt/agents/opencode/assets/coverage/lcov.info,coverage-js.lcov
# Test files and runtime fixtures are not product code. The sandbox adapter is
# mirrored into the OpenCode plugin assets from takt/runtime/sandbox/adapter.mjs;
# only the canonical source is executed under V8 coverage. Go testutil packages
# are test-only helpers imported solely from *_test.go files; Go attributes
# their coverage to no package without -coverpkg, so they would always read 0%.
sonar.coverage.exclusions=**/*.test.mjs,**/*.test.ts,**/*.test.tsx,**/testdata/**/*.mjs,takt/agents/opencode/assets/takt-sandbox.mjs,takt/**/testutil/**
