{{- if .Values.httpRoute.enabled }}
apiVersion: {{ .Values.httpRoute.apiVersion }}
kind: HTTPRoute
metadata:
  name: {{ include "takt-workspace.fullname" . }}
  labels:
    {{- include "takt-workspace.labels" . | nindent 4 }}
    {{- with .Values.httpRoute.labels }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.httpRoute.parentRefs }}
  parentRefs: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - {{ toYaml . | nindent 6 | trim }}
      backendRefs:
        - name: {{ include "takt-workspace.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
