apiVersion: v1
kind: Service
metadata:
  name: {{ include "takt-workspace.fullname" . }}
  labels:
    {{- include "takt-workspace.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- with .Values.service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "takt-workspace.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
