{{- $pvcAnnotations := deepCopy .Values.persistence.annotations -}}
{{- if .Values.persistence.retain -}}
{{- $_ := set $pvcAnnotations "helm.sh/resource-policy" "keep" -}}
{{- end -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "takt-workspace.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takt-workspace.labels" . | nindent 4 }}
    {{- with .Values.persistence.labels }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- if $pvcAnnotations }}
  annotations:
{{ toYaml $pvcAnnotations | nindent 4 }}
  {{- end }}
spec:
  accessModes: {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
