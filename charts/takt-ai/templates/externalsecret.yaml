{{- if .Values.externalSecret.enabled }}
{{- if not .Values.externalSecret.secretStoreRef.name }}
{{- fail "externalSecret.secretStoreRef.name is required when externalSecret.enabled is true" }}
{{- end }}
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ default (include "takt-ai.fullname" .) .Values.externalSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "takt-ai.labels" . | nindent 4 }}
    {{- with .Values.externalSecret.labels }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- with .Values.externalSecret.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef: {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ default (include "takt-ai.fullname" .) .Values.externalSecret.target.name }}
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy }}
    deletionPolicy: {{ .Values.externalSecret.target.deletionPolicy }}
    {{- with .Values.externalSecret.template }}
    template: {{ toYaml . | nindent 6 }}
    {{- end }}
  {{- with .Values.externalSecret.data }}
  data: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.externalSecret.dataFrom }}
  dataFrom: {{ toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
