name: SAST

# Semgrep is the repo's static analysis: gated by ci-required through
# workflow_call, plus a weekly run so updated rules reach unchanged code.
# Findings fail the job and land in code scanning (category "semgrep").
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '28 2 * * 5'

permissions:
  contents: read
  security-events: write

env:
  SEMGREP_IMAGE: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rulesets per language and surface in this repo; paths are filtered
      # by .semgrepignore.
      - name: Semgrep scan
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --error \
              --config p/golang \
              --config p/typescript \
              --config p/javascript \
              --config p/github-actions \
              --config p/dockerfile \
              --sarif-output=semgrep.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep
