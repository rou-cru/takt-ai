name: CI

on:
  push:
    branches: [main, stage]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # SonarCloud needs full history for blame/new-code analysis

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2

      - name: Test
        run: make test-host

      - name: Test shell scripts (offline fixtures)
        run: make test-shell

      - name: Test (containerized)
        run: ./scripts/test-containerized.sh -race -coverprofile=coverage-containerized.out

      - name: Coverage gate
        run: ./scripts/check-coverage.sh coverage.out coverage-containerized.out

      # Only takt/runtime/sandbox has an actual test suite today (probe.test.mjs,
      # documented in docs/verification/vfs-runtime.md as a manual verification
      # step). Non-blocking: that doc explicitly frames it as not release-gating,
      # so a sandboxing edge case on the runner shouldn't fail unrelated PRs —
      # it only feeds Sonar's JS coverage when it succeeds.
      - name: Test (sandbox adapter, JS coverage)
        continue-on-error: true
        run: |
          npm ci --prefix takt/runtime/sandbox --ignore-scripts
          node --test --experimental-test-coverage \
            --test-reporter=lcov --test-reporter-destination=coverage-js.lcov \
            takt/runtime/sandbox/probe.test.mjs

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
