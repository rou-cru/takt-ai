name: CI

on:
  push:
    branches: [main, stage]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test-host

      - name: Test (containerized)
        run: ./scripts/test-containerized.sh -coverprofile=coverage-containerized.out
