name: Regenerate gomarkdocs

on:
  push:
    branches: [trunk]

permissions:
  contents: write

jobs:
  regenerate-docs:
    # Prevent the bot commit from triggering this workflow again.
    if: github.event.head_commit.author.email != 'github-actions[bot]@users.noreply.github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate API docs
        run: make docs

      - name: Commit and push if changed
        run: |
          git add docs/api/
          git diff --staged --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate gomarkdoc API reference"
          git push
