# Dependency updates go to trunk, which accumulates the changes pending for the
# next release. Titles follow the conventional-commit rule enforced on pull
# requests; `chore` and `ci` alone never trigger a release.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: trunk
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /development/quality
    target-branch: trunk
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /takt/agents/opencode/assets
    target-branch: trunk
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /takt/runtime/sandbox
    target-branch: trunk
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy/images
    target-branch: trunk
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /development/testing
    target-branch: trunk
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /development/testing/e2e
    target-branch: trunk
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: helm
    directory: /charts/takt-ai
    target-branch: trunk
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: trunk
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
