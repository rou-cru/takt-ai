version: 1
# F1-4 versioned capability manifest (PR-SET-31): user-facing purpose,
# core/optional partition, dependencies, and presets.
# Selection and dependency reconciliation (PR-SET-17) both resolve against
# this manifest.
components:
  - id: context7
    purpose: Context7 — up-to-date library docs for agents
    core: false
    selectable: true
    deps: []
  # Reserved, non-omittable core: always installed, never user-selectable.
  - id: engram
    purpose: Engram — persistent memory for agents
    core: true
    selectable: false
    deps: []
  - id: skills
    purpose: Takt skills — workflows and conventions agents load on demand
    core: true
    selectable: false
    deps: []
  - id: specialists
    purpose: Takt specialists — the orchestrator and its specialist agents
    core: true
    selectable: false
    deps: []
  # Non-omittable: acquired via npm and wired by Takt with an absolute path
  # (takt/codegraph), like Engram; not a rendered artifact.
  - id: codegraph
    purpose: CodeGraph — codebase navigation for agents
    core: true
    selectable: false
    deps: []
