# Pins the transitive versions the plugin toolchain needs; pnpm 11 reads
# overrides here, not from package.json.
overrides:
  "@babel/core": 7.29.6
  seroval: 1.6.11
  seroval-plugins: 1.6.11
  # @npmcli/map-workspaces pins glob ^11.0.3; 11.0.x has GHSA-5j98-mcp5-4vw2.
  "glob@>=11.0.0 <11.1.0": ^11.1.0
  # GHSA minimatch ReDoS/DoS via globparts amplification; fixed in 11.0.1.
  "minimatch@>=7.0.0 <11.0.1": 11.0.1
