version: 1
# GC cycle cadence (PR-MNT-6, PR-OBS-BUS-4). Cadence is proportional to pace:
# a cycle is due once units dispatched and workspace mutations since the last
# cycle add up to one full budget. Error rate is deliberately not a parameter.
cadence:
  # Units dispatched since the last cycle that alone make a cycle due.
  units_per_cycle: 8
  # Counted mutations since the last cycle that alone make a cycle due.
  mutations_per_cycle: 40
  # Consecutive deferrals of a due cycle after which it is aborted instead of
  # skipped again, so a starved cycle is declared afresh rather than run late.
  max_deferrals: 3

limits:
  findings: 3
  files: 5

# Automatic demotion (PR-MNT-32). A mandate class whose attributed reversions
# exceed this fraction of registered work (never wall time) drops to
# proposal-only. Up to a quarter reads as review friction; above it the
# class's changes are failing to stick.
demotion:
  reversion_rate: 0.25
  # Registered work below this count is too small a denominator for a rate
  # to mean anything (one reedit out of two units is noise, not a pattern).
  min_registered_work: 8
